<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tamarka</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e8e8ea;
    --ink: #17171a;
    --muted: #8a8a90;
    --fade: 700ms;
    --font-main: "Space Grotesk", system-ui, sans-serif;  /* countdown + questions */
    --font-ui: "DM Sans", system-ui, sans-serif;          /* input, labels, hints */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-main);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 16px;
  }
  body { height: auto; min-height: 100%; padding: 24px 16px; }
  .stage { width: 100%; max-width: 820px; }
  .view {
    opacity: 0;
    transition: opacity var(--fade) ease;
    display: none;
  }
  .view.show { display: block; }
  .view.visible { opacity: 1; }

  .countdown { display: flex; gap: clamp(16px, 4vw, 48px); justify-content: center; }
  .unit { min-width: 0; }
  .unit b {
    display: block;
    font-weight: 300;
    font-size: clamp(48px, 13vw, 150px);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .unit span {
    display: block;
    margin-top: 12px;
    font: 400 12px var(--font-ui);
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .question {
    font-weight: 500;
    font-size: clamp(26px, 5vw, 46px);
    line-height: 1.25;
    margin: 0 0 48px;
  }
  .blank { display: inline-block; min-width: 3ch; border-bottom: 2px solid var(--ink); }

  input {
    width: min(100%, 420px);
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--ink);
    outline: none;
    color: var(--ink);
    font: 400 24px var(--font-ui);
    text-align: center;
    padding: 8px 0;
  }
  input::placeholder { color: var(--muted); }
  .hint {
    margin-top: 14px;
    font: 400 12px var(--font-ui);
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .intro-title { font-weight: 500; font-size: clamp(30px, 6vw, 56px); line-height: 1.2; margin: 0 0 24px; }
  .intro-text { font: 400 clamp(16px, 2.4vw, 20px) var(--font-ui); line-height: 1.6; color: var(--muted); margin: 0 auto; max-width: 30em; }
  .intro-btn {
    margin-top: 36px;
    background: none; border: 0; border-bottom: 1px solid var(--ink);
    padding: 4px 0;
    font: 400 14px var(--font-ui);
    letter-spacing: .2em; text-transform: uppercase;
    color: var(--ink); cursor: pointer;
  }
  .final { font-size: clamp(36px, 8vw, 80px); font-weight: 300; }

  .end-link {
    display: inline-block;
    margin-top: 32px;
    font: 400 14px var(--font-ui);
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--ink);
    border-bottom: 1px solid var(--ink);
    text-decoration: none;
    padding-bottom: 4px;
  }

  .end-code {
    margin-top: 28px;
    font: 400 12px var(--font-ui);
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .end-code code {
    display: block;
    margin-top: 8px;
    font: 500 20px var(--font-ui);
    letter-spacing: .08em;
    text-transform: none;
    color: var(--ink);
    user-select: all;
  }

  .shake { animation: shake 450ms cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-9px); }
    40%, 60% { transform: translateX(9px); }
  }

  .shot-wrap {
    position: relative;
    width: fit-content;
    max-width: 100%;
    margin: -16px auto 32px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 14px rgba(0,0,0,.12);
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .shot-wrap[hidden] { display: none; }
  .shot {
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
    max-width: 100%;
    max-height: 38vh;
  }
  .shot-blur {
    position: absolute;
    backdrop-filter: blur(9px);
    -webkit-backdrop-filter: blur(9px);
    opacity: 1;
    transition: opacity 500ms ease;
  }
  .shot-blur.off { opacity: 0; }
  .choices { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .choices .opt {
    width: min(100%, 420px);
    padding: 12px 16px;
    background: transparent;
    border: 1px solid var(--ink);
    color: var(--ink);
    font: 400 20px var(--font-ui);
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .choices .picklabel {
    font: 400 12px var(--font-ui);
    letter-spacing: .2em; text-transform: uppercase;
    color: var(--muted);
  }
  [hidden] { display: none !important; }

</style>
</head>
<body>
  <main class="stage">
    <section id="countdown" class="view">
      <div class="countdown">
        <div class="unit"><b id="d">00</b><span>dní</span></div>
        <div class="unit"><b id="h">00</b><span>hodín</span></div>
        <div class="unit"><b id="m">00</b><span>minút</span></div>
        <div class="unit"><b id="s">00</b><span>sekúnd</span></div>
      </div>
    </section>

    <section id="intro" class="view">
      <h1 class="intro-title" id="introTitle"></h1>
      <p class="intro-text" id="introText"></p>
      <button type="button" class="intro-btn" id="introBtn"></button>
    </section>

    <section id="quiz" class="view">
      <p class="question" id="question"></p>
      <div class="shot-wrap" id="shotWrap" hidden>
        <img class="shot" id="shot" alt="">
        <div class="shot-blur" id="shotBlur" hidden></div>
      </div>
      <input id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="odpoveď">
      <div class="hint" id="hint">enter</div>
      <div class="choices" id="choices" hidden></div>
    </section>

    <section id="end" class="view">
      <div class="final" id="final"></div>
      <a class="end-link" href="https://www.saal-digital.eu/WebshopClient/#/Designer/8dd8c88ed5edf3a98e28273c819c2cd9/4140882957d545b08200a69641c8eb499dc45fcf23354176b7affce2a08350ff/0/cs/" target="_blank" rel="noopener">Otvoriť</a>
      <div class="end-code">Zľavový kód<code>DQYXD8nhUc-PFL</code></div>
    </section>
  </main>

  <script src="questions.js"></script>
  <script>
  (() => {
    const { targetDate, questions, finalMessage, intro } = window.QUIZ;
    const FADE = 700;
    const $ = (id) => document.getElementById(id);
    const views = { countdown: $("countdown"), intro: $("intro"), quiz: $("quiz"), end: $("end") };
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    const normalize = (s) =>
      s.normalize("NFD").replace(/[̀-ͯ]/g, "")
        .toLowerCase().replace(/[^a-z0-9\s]/g, "").replace(/\s+/g, " ").trim();

    // ---- view transitions
    let current = null;
    async function show(name) {
      if (current) {
        current.classList.remove("visible");
        await sleep(FADE);
        current.classList.remove("show");
      }
      current = views[name];
      current.classList.add("show");
      void current.offsetWidth; // force reflow so the fade runs
      current.classList.add("visible");
    }

    // ---- countdown
    let phase = "countdown";
    const pad = (n) => String(n).padStart(2, "0");
    function tick() {
      if (phase !== "countdown") return;
      const left = targetDate - Date.now();
      if (left <= 0) return startQuiz();
      const t = Math.floor(left / 1000);
      $("d").textContent = pad(Math.floor(t / 86400));
      $("h").textContent = pad(Math.floor(t / 3600) % 24);
      $("m").textContent = pad(Math.floor(t / 60) % 60);
      $("s").textContent = pad(t % 60);
      setTimeout(tick, 250);
    }

    // ---- quiz (progress persisted in localStorage; ?reset clears it)
    const progress = {
      get: () => { try { return Number(localStorage.getItem("quizIndex")) || 0; } catch { return 0; } },
      set: (n) => { try { localStorage.setItem("quizIndex", String(n)); } catch {} },
    };
    if (new URLSearchParams(location.search).has("reset")) progress.set(0);
    let index = Math.min(progress.get(), questions.length);
    let busy = false;
    const input = $("answer");

    const shot = $("shot");
    for (const type of ["contextmenu", "dragstart", "selectstart"]) {
      $("shotWrap").addEventListener(type, (e) => e.preventDefault());
    }
    const choices = $("choices");

    function renderChoices(q) {
      choices.replaceChildren();
      const label = document.createElement("div");
      label.className = "picklabel";
      label.textContent = "vyber jednu";
      choices.append(label);
      q.options.forEach((o) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "opt";
        b.textContent = o.text;
        b.addEventListener("click", () => {
          if (busy) return;
          submit(Boolean(o.correct), choices);
        });
        choices.append(b);
      });
    }

    function renderQuestion() {
      const q = questions[index];
      const isChoice = q.type === "choice";
      $("question").innerHTML = q.text
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/___+/g, '<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
      $("shotWrap").hidden = !q.image;
      if (q.image) shot.src = q.image;
      const blur = $("shotBlur");
      blur.classList.remove("off");
      blur.hidden = !q.blur;
      if (q.blur) {
        const { x, y, w, h } = q.blur;
        Object.assign(blur.style, { left: x + "%", top: y + "%", width: w + "%", height: h + "%" });
      }
      input.hidden = isChoice;
      $("hint").hidden = isChoice;
      choices.hidden = !isChoice;
      if (isChoice) renderChoices(q);
      else input.value = "";
    }

    function focusAnswer() {
      if (!input.hidden) input.focus();
    }

    async function startQuiz() {
      if (phase !== "countdown") return;
      phase = "quiz";
      if (index >= questions.length) {
        $("final").textContent = finalMessage;
        await show("end");
        return;
      }
      if (index === 0) {
        phase = "intro";
        await show("intro");
        return;
      }
      await beginQuestions();
    }

    async function beginQuestions() {
      phase = "quiz";
      renderQuestion();
      await show("quiz");
      focusAnswer();
    }

    $("introTitle").textContent = intro.title;
    $("introText").textContent = intro.text;
    $("introBtn").textContent = intro.button;
    $("introBtn").addEventListener("click", () => {
      if (phase === "intro") beginQuestions();
    });

    async function next() {
      busy = true;
      if (questions[index].blur) {
        $("shotBlur").classList.add("off");
        await sleep(700);
      }
      index += 1;
      progress.set(index);
      if (index >= questions.length) {
        $("final").textContent = finalMessage;
        await show("end");
        return;
      }
      current.classList.remove("visible");
      await sleep(FADE);
      renderQuestion();
      current.classList.add("visible");
      focusAnswer();
      busy = false;
    }

    function isCorrect(value) {
      const v = normalize(value);
      const { answers } = questions[index];
      const accepted = typeof answers === "function" ? answers() : answers;
      return v !== "" && accepted.some((a) => normalize(a) === v);
    }

    // Correct => next question; wrong => shake the answer element.
    function submit(ok, el) {
      if (ok) return next();
      el.classList.remove("shake");
      void el.offsetWidth;
      el.classList.add("shake");
      if (el === input) input.select();
    }

    input.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" || busy) return;
      submit(isCorrect(input.value), input);
    });
    input.addEventListener("animationend", () => input.classList.remove("shake"));
    choices.addEventListener("animationend", () => choices.classList.remove("shake"));

    // Already answered something => countdown was passed before, skip it.
    if (index > 0) startQuiz();
    else show("countdown").then(tick);
  })();
  </script>
</body>
</html>
