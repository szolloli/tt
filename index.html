<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tamarka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e8e8ea;
    --ink: #17171a;
    --muted: #8a8a90;
    --fade: 700ms;
    --font-main: "Space Grotesk", system-ui, sans-serif;  /* countdown + questions */
    --font-ui: "DM Sans", system-ui, sans-serif;          /* input, labels, hints */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-main);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 16px;
  }
  .stage { width: 100%; max-width: 820px; }
  .view {
    opacity: 0;
    transition: opacity var(--fade) ease;
    display: none;
  }
  .view.show { display: block; }
  .view.visible { opacity: 1; }

  .countdown { display: flex; gap: clamp(16px, 4vw, 48px); justify-content: center; }
  .unit { min-width: 0; }
  .unit b {
    display: block;
    font-weight: 300;
    font-size: clamp(48px, 13vw, 150px);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .unit span {
    display: block;
    margin-top: 12px;
    font: 400 12px var(--font-ui);
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .question {
    font-weight: 500;
    font-size: clamp(26px, 5vw, 46px);
    line-height: 1.25;
    margin: 0 0 48px;
  }
  .blank { display: inline-block; min-width: 3ch; border-bottom: 2px solid var(--ink); }

  input {
    width: min(100%, 420px);
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--ink);
    outline: none;
    color: var(--ink);
    font: 400 24px var(--font-ui);
    text-align: center;
    padding: 8px 0;
  }
  input::placeholder { color: var(--muted); }
  .hint {
    margin-top: 14px;
    font: 400 12px var(--font-ui);
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .final { font-size: clamp(36px, 8vw, 80px); font-weight: 300; }

  .shake { animation: shake 450ms cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-9px); }
    40%, 60% { transform: translateX(9px); }
  }

  .debug {
    position: fixed; right: 14px; bottom: 12px;
    font: 400 11px var(--font-ui);
    letter-spacing: .15em; text-transform: uppercase;
    color: var(--muted);
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none;
  }
  .debug input { width: auto; margin: 0; }
</style>
</head>
<body>
  <main class="stage">
    <section id="countdown" class="view">
      <div class="countdown">
        <div class="unit"><b id="d">00</b><span>dní</span></div>
        <div class="unit"><b id="h">00</b><span>hodín</span></div>
        <div class="unit"><b id="m">00</b><span>minút</span></div>
        <div class="unit"><b id="s">00</b><span>sekúnd</span></div>
      </div>
    </section>

    <section id="quiz" class="view">
      <p class="question" id="question"></p>
      <input id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="odpoveď">
      <div class="hint">enter</div>
    </section>

    <section id="end" class="view">
      <div class="final" id="final"></div>
    </section>
  </main>

  <label class="debug"><input type="checkbox" id="debug"> debug</label>

  <script src="questions.js"></script>
  <script>
  (() => {
    const { targetDate, questions, finalMessage } = window.QUIZ;
    const FADE = 700;
    const $ = (id) => document.getElementById(id);
    const views = { countdown: $("countdown"), quiz: $("quiz"), end: $("end") };
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    const normalize = (s) =>
      s.normalize("NFD").replace(/[̀-ͯ]/g, "")
        .toLowerCase().replace(/[^a-z0-9\s]/g, "").replace(/\s+/g, " ").trim();

    // ---- view transitions
    let current = null;
    async function show(name) {
      if (current) {
        current.classList.remove("visible");
        await sleep(FADE);
        current.classList.remove("show");
      }
      current = views[name];
      current.classList.add("show");
      void current.offsetWidth; // force reflow so the fade runs
      current.classList.add("visible");
    }

    // ---- debug switch (checkbox, persisted; ?debug in URL also enables)
    const dbg = $("debug");
    const store = {
      get: () => { try { return localStorage.getItem("debug") === "1"; } catch { return false; } },
      set: (v) => { try { localStorage.setItem("debug", v ? "1" : "0"); } catch {} },
    };
    dbg.checked = store.get() || new URLSearchParams(location.search).has("debug");
    dbg.addEventListener("change", () => {
      store.set(dbg.checked);
      if (dbg.checked && phase === "countdown") startQuiz();
    });

    // ---- countdown
    let phase = "countdown";
    const pad = (n) => String(n).padStart(2, "0");
    function tick() {
      if (phase !== "countdown") return;
      const left = targetDate - Date.now();
      if (left <= 0 || dbg.checked) return startQuiz();
      const t = Math.floor(left / 1000);
      $("d").textContent = pad(Math.floor(t / 86400));
      $("h").textContent = pad(Math.floor(t / 3600) % 24);
      $("m").textContent = pad(Math.floor(t / 60) % 60);
      $("s").textContent = pad(t % 60);
      setTimeout(tick, 250);
    }

    // ---- quiz (progress persisted in localStorage; ?reset clears it)
    const progress = {
      get: () => { try { return Number(localStorage.getItem("quizIndex")) || 0; } catch { return 0; } },
      set: (n) => { try { localStorage.setItem("quizIndex", String(n)); } catch {} },
    };
    if (new URLSearchParams(location.search).has("reset")) progress.set(0);
    let index = Math.min(progress.get(), questions.length);
    let busy = false;
    const input = $("answer");

    function renderQuestion() {
      const html = questions[index].text
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/___+/g, '<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
      $("question").innerHTML = html;
      input.value = "";
    }

    async function startQuiz() {
      if (phase !== "countdown") return;
      phase = "quiz";
      if (index >= questions.length) {
        $("final").textContent = finalMessage;
        await show("end");
        return;
      }
      renderQuestion();
      await show("quiz");
      input.focus();
    }

    async function next() {
      busy = true;
      index += 1;
      progress.set(index);
      if (index >= questions.length) {
        $("final").textContent = finalMessage;
        await show("end");
        return;
      }
      current.classList.remove("visible");
      await sleep(FADE);
      renderQuestion();
      current.classList.add("visible");
      input.focus();
      busy = false;
    }

    function isCorrect(value) {
      const v = normalize(value);
      return v !== "" && questions[index].answers.some((a) => normalize(a) === v);
    }

    input.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" || busy) return;
      if (isCorrect(input.value)) return next();
      input.classList.remove("shake");
      void input.offsetWidth;
      input.classList.add("shake");
      input.select();
    });
    input.addEventListener("animationend", () => input.classList.remove("shake"));

    // Already answered something => countdown was passed before, skip it.
    if (index > 0) startQuiz();
    else show("countdown").then(tick);
  })();
  </script>
</body>
</html>
